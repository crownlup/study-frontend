<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Profil Saya</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .profile-card {
            background-color: white;
            width: 350px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #3498db;
        }

        h1 {
            margin: 15px 0 5px 0;
            font-size: 24px;
            color: #2c3e50;
        }

        .job-title {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .bio {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .skills-list {
            list-style: none;
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .skill-badge {
            background-color: #ebf5fb;
            color: #2980b9;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .btn-contact {
            display: inline-block;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-contact:hover {
            background-color: #1d6fa5;
        }
    </style>
</head>
<body>

    <!-- KONTEN PROFIL -->
    <div class="profile-card">
        <!-- 1. GAMBAR -->
        <img class="profile-img" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80" alt="Foto Profil">

        <!-- 2. HEADING (NAMA) -->
        <h1>[ Nama Kamu ]</h1>
        <p class="job-title">Calon Frontend Developer 💻</p>

        <!-- 3. PARAGRAF BIO -->
        <p class="bio">
            Halo! Saya sedang belajar <strong>Frontend Web Development</strong>. Saya suka membuat tampilan web yang rapi, modern, dan nyaman digunakan.
        </p>

        <!-- 4. DAFTAR KEAHLIAN -->
        <ul class="skills-list">
            <span class="skill-badge">HTML5</span>
            <span class="skill-badge">CSS3</span>
            <span class="skill-badge">JavaScript</span>
        </ul>

        <!-- 5. LINK / TOMBOL -->
        <a href="https://github.com" target="_blank" class="btn-contact">Kunjungi GitHub Saya</a>
    </div>

</body>
</html>
